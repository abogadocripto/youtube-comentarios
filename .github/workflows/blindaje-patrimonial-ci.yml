# CI de blindaje-patrimonial/ (docs/01 §5: GitHub Actions solo para CI, nunca para publicar).
# La batería adversarial (tests/adversarial) es bloqueante: si un caso «malo» pasa la validación, CI falla.
name: blindaje-patrimonial CI

on:
  push:
    paths: ["blindaje-patrimonial/**", ".github/workflows/blindaje-patrimonial-ci.yml"]
  pull_request:
    paths: ["blindaje-patrimonial/**", ".github/workflows/blindaje-patrimonial-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blindaje-patrimonial
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blindaje-patrimonial/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Configuración y esquemas
        run: bp doctor
      - name: Batería adversarial (bloqueante)
        run: pytest tests/adversarial -q
      - name: Resto de pruebas (incluida la integración con PostgreSQL)
        run: pytest -q
      - name: Daily de demostración (offline)
        run: bp demo --llm static --out out/demo
      - uses: actions/upload-artifact@v4
        with:
          name: daily-demo
          path: blindaje-patrimonial/out/demo/
