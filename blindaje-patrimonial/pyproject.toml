[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindaje-patrimonial"
version = "0.1.0"
description = "Sistema automático de inteligencia patrimonial: Daily Bitcoin, Informe semanal y Alertas."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bp = "bp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bp = ["editorial/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP017"]   # timezone.utc: legible y compatible
