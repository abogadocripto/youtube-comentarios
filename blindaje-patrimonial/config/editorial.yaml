# Léxico vetado (V-LEX). Expresiones regulares insensibles a mayúsculas, con límites de palabra.
lexicon:
  imperativos_inversion:
    - '\bcompr(a|ad|en|e)\b'
    - '\bvend(e|ed|an)\b'
    - '\bacumul(ad|en)\b'           # «acumula» (3.ª persona) es descriptivo y no se veta
    - 'momento para acumular'
    - '\bmant[eé]n(ed|gan)?\b'
    - '\baprovech(a|ad|en)\b'
    - 'es (el )?momento de'
    - 'deber[ií]as invertir'
    - 'toma(r)? beneficios'
    - 'buen momento para'
    - 'oportunidad de (entrada|compra)'
  predicciones:
    - '\bsubir[áa]n?\b'
    - '\bbajar[áa]n?\b'
    - '\bcaer[áa]n?\b'
    - '\bva a (subir|bajar|caer|romper|superar|alcanzar)'
    - 'objetivo de precio'
    - 'precio objetivo'
    - '\brebote\b'
    - '\bsoporte\b'
    - '\bresistencia\b'
    - '\brally\b'
    - '\btecho\b'
    - '\bsuelo\b'
    - '\bdebería (subir|bajar|superar|caer)'
  personalizacion:
    - 'en tu caso'
    - 'te recomendamos'
    - 'te recomiendo'
    - 'si tienes \S+ (btc|bitcoins?)'
  valorativo_instrumentos:
    - '\binfravalorad[oa]s?\b'
    - '\bsobrevalorad[oa]s?\b'
    - 'favorable para comprar'
    - '(etf|ibit|fbtc)\s+\S*\s*(es|son) (mejor|peor)'
    - 'usa la wallet'
    - 'mueve tus fondos'
  garantias_bombo:
    - '\bgarantizad[oa]s?\b'
    - 'sin riesgo'
    - 'oportunidad única'
    - 'no te lo pierdas'
    - '\bseñal(es)? de (compra|venta)'
  evasion_fiscal:
    - 'evita(r)? pagar'
    - 'no declares'
    - 'que hacienda no se entere'
  deontologia:
    - 'te garantizamos'
    - '\bganaremos\b'
    - '(reclama|demanda) ya'
  jerga:
    - 'to the moon'
    - '\bhodl\b'
    - '\bpump\b'
    - '\bdump\b'
    - '\bbullish\b'
    - '\bbearish\b'
    - '\bfomo\b'
  sensacionalismo:
    - '\bbrutal(es)?\b'
    - '\bmasiv[oa]s?\b'
    - '\bdesplome\b'
    - '\bpánico\b'
    - '\burgente\b'
    - '(?<!máximo )(?<!mínimo )\bhistóric[oa]s?\b'   # «máximo histórico» es un término factual; el resto, solo con ath_new

lexicon_exceptions:
  historic_allowed_if_state: ath_new

# Léxico de dirección (V-DIR): verbos/sustantivos que implican signo.
direction:
  positive: ['sube', 'suben', 'subió', 'aumenta', 'aumentan', 'aumentó', 'crece', 'crecen', 'avanza', 'avanzan', 'repunta', 'entradas', 'acumulación', 'mejora', 'se expande', 'expansión']
  negative: ['baja', 'bajan', 'bajó', 'cae', 'caen', 'cayó', 'retrocede', 'retroceden', 'desciende', 'descienden', 'salidas', 'distribución', 'se enfría', 'enfriamiento', 'contracción', 'se contrae']
  window_words: 6

causal_connectors: ['impulsa', 'impulsan', 'provoca', 'provocan', 'hace que', 'debido a', 'gracias a', 'arrastra', 'arrastran', 'causa', 'causan']

number_words: ['tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'veinte', 'treinta', 'cien', 'mil', 'millón', 'millones', 'docena', 'tercera', 'tercer', 'cuarta', 'cuarto', 'quinta', 'quinto', 'sexta', 'séptima', 'octava', 'décima', 'por ciento']

stale_today_words: ['hoy', 'ayer', 'esta mañana', 'última sesión', 'la sesión de ayer']

# Expresiones de ventana temporal que pueden llevar dígitos sin ser datos (V-NUM)
number_whitelist_phrases: ['24 horas', '24 h', '7 días', '30 días', '5 sesiones', '20 sesiones', '4 semanas', '3 meses', '10 años', '2 años', '8 h']

weekend_forbidden: ['sesión de ayer', 'ayer en wall street', 'cierre de ayer en', 'la sesión del domingo', 'la sesión del sábado']

subject_alarm: ['urgente', 'última hora', 'no te lo pierdas', 'alerta máxima', '🚨', '🔥', '🚀', '‼']

