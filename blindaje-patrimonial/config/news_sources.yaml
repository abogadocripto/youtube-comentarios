  # ════════════════════ ESPAÑA ════════════════════
  - id: boe_sumario
    name: "BOE — Sumario diario (API datos abiertos)"
    tier: T1
    jurisdictions: [ES]
    fronts: [fiscal, regulatorio, proteccion]
    method: api
    url: "https://www.boe.es/datosabiertos/api/boe/sumario/{YYYYMMDD}"
    headers: {Accept: application/json}
    poll: "cada 5 min de 07:30 a 08:45 hasta que aparezca el número; lunes a sábado (sin edición en domingo)"
    filter: {secciones: ["I", "II-B", "III"], departamentos: ["Ministerio de Hacienda", "Ministerio de Economía", "Comisión Nacional del Mercado de Valores", "Banco de España", "Jefatura del Estado"]}
    detail_url: "https://www.boe.es/diario_boe/xml.php?id={BOE-A-...}"
    legal_value: official_journal
    attribution: "Fuente de los datos: Agencia Estatal Boletín Oficial del Estado"
    dedup_key: identificador
    fallback: [boe_rss, boe_alertas_email]
    status: ok

  - {id: boe_rss, name: "BOE — RSS por sección", tier: T1, jurisdictions: [ES], fronts: [fiscal, regulatorio], method: rss, url: "https://www.boe.es/rss/", poll: "30 min", legal_value: official_journal, status: fallback}
